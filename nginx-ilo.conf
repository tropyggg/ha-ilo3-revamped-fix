server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    proxy_ssl_verify off;
    underscores_in_headers on;

    location / {
        proxy_pass http://ILO_IP_ADDRESS:80/;
        
        proxy_redirect http://ILO_IP_ADDRESS/ https://$host:7195/;
        proxy_redirect https://ILO_IP_ADDRESS/ https://$host:7195/;
        proxy_redirect / https://$host:7195/;

        proxy_set_header Host ILO_IP_ADDRESS;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 64k;
        
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}
