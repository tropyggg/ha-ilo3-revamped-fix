LoadModule proxy_module /usr/lib/apache2/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/mod_proxy_http.so
LoadModule proxy_connect_module /usr/lib/apache2/mod_proxy_connect.so
LoadModule ssl_module /usr/lib/apache2/mod_ssl.so

<VirtualHost *:443>
    ServerName localhost
    ErrorLog /var/log/apache2/error.log
    LogLevel warn

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.crt
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    SSLProxyEngine on
    SSLProxyProtocol ALL
    SSLProxyCipherSuite ALL:COMPLEMENTOFALL:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+SSLv3:@SECLEVEL=0
    
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass / https://192.168.1.125/
    ProxyPassReverse / https://192.168.1.125/
</VirtualHost>
