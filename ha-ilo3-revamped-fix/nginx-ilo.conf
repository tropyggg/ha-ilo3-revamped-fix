server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Спираме излишните проверки на хедърите, които карат iLO 3 да връща грешка 400
    proxy_ssl_verify off;
    underscores_in_headers on;

    location / {
        proxy_pass http://192.168.1.125:80/;
        
        # 🚀 СЪДБОНОСЕН ФИКС: Хващаме опитите на iLO 3 да ни пренасочи към неговия HTTPS
        # и ги пренаписваме да сочат обратно към нашето прокси
        proxy_redirect http://192.168.1.125/ https://$host:7195/;
        proxy_redirect https://192.168.1.125/ https://$host:7195/;
        proxy_redirect / https://$host:7195/;

        # Подаваме правилния Host хедър, за да не се бърка уеб сървърът на iLO
        proxy_set_header Host 192.168.1.125;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Разширяваме буферите за огромните XML структури на HP iLO 3
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 64k;
        
        # Увеличаваме времето за изчакване, тъй като iLO 3 е бавно хардуерно
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}
