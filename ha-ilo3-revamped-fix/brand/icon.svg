<svg xmlns="http://w3.org" viewBox="0 0 800 300" width="100%" height="100%">
  <!-- Фон (прозрачен, за да пасва на тъмна и светла тема) -->
  <rect width="800" height="300" fill="none"/>

  <!-- ЛЯВА ЧАСТ: HP iLO Елемент -->
  <g id="hp-ilo-side" transform="translate(50, 50)">
    <!-- Кръг в стил HP (Син/Сив брандинг) -->
    <circle cx="100" cy="100" r="90" fill="#007DBA"/>
    <!-- Стилизиран текст hp/iLO -->
    <text x="60" y="115" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="bold" font-style="italic" fill="#FFFFFF">hp</text>
    <rect x="40" y="135" width="120" height="35" rx="10" fill="#424242"/>
    <text x="75" y="160" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#00FF00">iLO3</text>
  </g>

  <!-- СРЕДНА ЧАСТ: Прокси Стрелки -->
  <g id="proxy-arrows" transform="translate(325, 110)">
    <!-- Горна стрелка надясно (към HA) -->
    <path d="M 0 20 L 110 20 M 90 0 L 110 20 L 90 40" fill="none" stroke="#666666" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Долна стрелка наляво (обратна връзка/диагностика) -->
    <path d="M 150 60 L 40 60 M 60 40 L 40 60 L 60 80" fill="none" stroke="#03A9F4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ДЯСНА ЧАСТ: Home Assistant Лого (Нов дизайн) -->
  <g id="home-assistant-side" transform="translate(550, 50)">
    <!-- Къщичката на HA -->
    <path d="M 100 10 L 10 90 L 40 90 L 40 180 L 160 180 L 160 90 L 190 90 Z" fill="#03A9F4"/>
    <!-- Вътрешни електронни възли (пътечки) -->
    <circle cx="100" cy="75" r="12" fill="#FFFFFF"/>
    <circle cx="70" cy="130" r="12" fill="#FFFFFF"/>
    <circle cx="130" cy="130" r="12" fill="#FFFFFF"/>
    <!-- Линии на свързване -->
    <line x1="100" y1="75" x2="100" y2="150" stroke="#FFFFFF" stroke-width="10"/>
    <line x1="100" y1="105" x2="70" y2="130" stroke="#FFFFFF" stroke-width="10"/>
    <line x1="100" y1="105" x2="130" y2="130" stroke="#FFFFFF" stroke-width="10"/>
  </g>
</svg>
